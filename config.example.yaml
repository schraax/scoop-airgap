storage:
  # type selects the backend:
  #   "artifactory" (default) — JFrog Artifactory; supports X-JFrog-Art-Api key auth
  #   "generic"               — any HTTP server with PUT/HEAD + Basic auth
  #                             (Nexus OSS raw repository, nginx WebDAV, Caddy, …)
  type: artifactory

  # Root URL of the storage server, without the repository name (no trailing slash).
  # Artifactory: https://artifactory.example.com/artifactory
  # Nexus OSS:   http://nexus:8081/repository
  base_url: https://artifactory.example.com/artifactory

  # Repository / bucket name inside the storage server.
  repo: scoop-mirror

  # Credentials — use env-var expansion to keep secrets out of this file.
  # For Artifactory without a username the value is used as an API key
  # (X-JFrog-Art-Api header). With a username, Basic auth is used instead.
  username: ${STORAGE_USER}
  password: ${STORAGE_PASSWORD}

git:
  branch: main

  # --- Authentication: choose one of the two options below ---

  # Option 1 — Personal access token (simple setup)
  auth_token: ${GIT_AUTH_TOKEN}

  # Option 2 — GitHub App (recommended for production; better audit trail,
  # no shared long-lived credentials, permissions scoped per installation)
  # When github_app is set, auth_token is ignored.
  #
  # github_app:
  #   app_id: 123456           # numeric App ID from the app's settings page
  #   installation_id: 78901234  # numeric ID visible in the install URL
  #   # Supply the RSA private key inline via an env var:
  #   private_key: "${GITHUB_APP_PRIVATE_KEY}"
  #   # Or point to a PEM file (e.g. a mounted Kubernetes secret):
  #   # private_key_path: /run/secrets/github-app.pem

  # GitHub Enterprise Server: set api_url to the GHES REST API root.
  # Leave unset for github.com (auto-detected) or Gitea/Forgejo (auto-detected).
  # api_url: https://github.corp.com/api/v3
  # Parent directory for clones; each bucket is placed at {local_path_base}/{name}.
  # A temporary directory is used if omitted.
  local_path_base: /var/cache/scoop-airgap
  # Set to true to push manifest changes to a new branch and open a pull
  # request instead of committing directly to `branch`. Useful when branch
  # protection rules are in place and a human-in-the-loop review is required
  # before updated manifests go live. Requires auth_token to have PR-creation
  # permissions. Supports GitHub and Gitea/Forgejo.
  pull_request: false

# Number of concurrent downloads (default: 4)
workers: 4

# Only mirror a version if its manifest has been in the upstream bucket for at
# least this many days. Protects against pulling brand-new releases before they
# have been validated by the broader community. 0 disables the check (default).
# Requires the bucket URL to be hosted on raw.githubusercontent.com.
cooldown_days: 3

buckets:
  - name: main
    # Raw-file base URL for the public upstream bucket
    url: https://raw.githubusercontent.com/ScoopInstaller/Main/master/bucket
    # Internal Git repo that mirrors this bucket — same layout as the original,
    # so clients add it with: scoop bucket add internal-main <repo_url>
    repo_url: https://git.example.com/scoop/main.git
    apps:
      - git
      - curl
      - jq
      - 7zip

  - name: extras
    url: https://raw.githubusercontent.com/ScoopInstaller/Extras/master/bucket
    repo_url: https://git.example.com/scoop/extras.git
    apps:
      - vscode
      - notepadplusplus
      - winmerge
