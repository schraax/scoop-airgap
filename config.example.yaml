artifactory:
  # Root URL of the Artifactory instance (no trailing slash)
  base_url: https://artifactory.example.com/artifactory
  # Generic repository name inside Artifactory
  repo: scoop-mirror
  # Credentials — use env-var expansion to keep secrets out of this file
  username: ${ARTIFACTORY_USER}
  api_key: ${ARTIFACTORY_API_KEY}

bucket_repo:
  # Internal Git server hosting the adapted bucket definitions
  url: https://git.example.com/scoop/internal-bucket.git
  branch: main
  # Local path for the clone; a temp dir is used if left empty
  local_path: /var/cache/scoop-upstream/bucket
  # Optional: embed a token into the HTTPS URL (https://token@host/...)
  auth_token: ${GIT_AUTH_TOKEN}

# Number of concurrent downloads (default: 4)
workers: 4

buckets:
  - name: main
    # Raw-file base URL for the public bucket
    url: https://raw.githubusercontent.com/ScoopInstaller/Main/master/bucket
    apps:
      - git
      - curl
      - jq
      - 7zip

  - name: extras
    url: https://raw.githubusercontent.com/ScoopInstaller/Extras/master/bucket
    apps:
      - vscode
      - notepadplusplus
      - winmerge
